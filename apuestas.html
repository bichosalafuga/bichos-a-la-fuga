<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bichos a la fuga – Apuestas</title>

<style>
body { font-family:sans-serif; margin:0; background:#f8f8f8; }
header { background:#4CAF50; color:white; padding:20px; text-align:center; }
main { margin:20px; }
fieldset { margin-bottom:20px; padding:15px; background:#fff;
           border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,.1); }
label { display:block; margin:10px 0; }
select, input { padding:5px; font-size:16px; }
button { background:#4CAF50; color:white; border:none;
         padding:10px 20px; font-size:16px;
         border-radius:5px; cursor:pointer; }
button:hover { background:#45a049; }
pre { background:#f0f0f0; padding:10px; white-space:pre-wrap; }
footer { text-align:center; margin:40px 0; }
footer a { margin:0 10px; color:#4CAF50; text-decoration:none; }
</style>
</head>

<body>

<header>
  <h1>🐌 Bichos a la fuga</h1>
  <p>Haz tu apuesta</p>
</header>

<main>

<fieldset>
  <legend>Tu apuesta</legend>

  <label>Nombre del jugador
    <input type="text" id="nombreJugador">
  </label>

  <label>Carrera
    <select id="carreraId">
      <option value="1">Escalada Pegada</option>
      <option value="2">Desliz Extremo</option>
      <option value="3">Reto Baboso</option>
      <option value="4">Turbo Caracol</option>
      <option value="5">Lenta Conquista</option>
      <option value="6">Súper Resbalón</option>
      <option value="7">Meta Babosa</option>
      <option value="8">Final Legendaria</option>
    </select>
  </label>

  <label>Ganador
    <select id="ganador">
      <option>Toreto</option>
      <option>Sinhuellas</option>
      <option>Gari</option>
      <option>Arrastrado</option>
      <option>Baboso Flash</option>
    </select>
  </label>

  <label>Segundo
    <select id="segundo">
      <option>Toreto</option>
      <option>Sinhuellas</option>
      <option>Gari</option>
      <option>Arrastrado</option>
      <option>Baboso Flash</option>
    </select>
  </label>

  <label>Tercero
    <select id="tercero">
      <option>Toreto</option>
      <option>Sinhuellas</option>
      <option>Gari</option>
      <option>Arrastrado</option>
      <option>Baboso Flash</option>
    </select>
  </label>

  <label>Primer caracol en moverse
    <select id="primerMovimiento">
      <option>Toreto</option>
      <option>Sinhuellas</option>
      <option>Gari</option>
      <option>Arrastrado</option>
      <option>Baboso Flash</option>
    </select>
  </label>

  <label>Primer caracol en salirse
    <select id="primerSalida">
      <option>Toreto</option>
      <option>Sinhuellas</option>
      <option>Gari</option>
      <option>Arrastrado</option>
      <option>Baboso Flash</option>
    </select>
  </label>

  <label>Tiempo predominante
    <select id="tiempo">
      <option value="0-10">0-10</option>
      <option value="10-20">10-20</option>
      <option value="20-30">20-30</option>
    </select>
  </label>

  <label>¿Cuántos llegaron?
    <select id="llegaron">
      <option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option>
    </select>
  </label>

  <button id="enviarApuesta">Enviar apuesta</button>
  <pre id="resultado"></pre>
</fieldset>

</main>

<footer>
  <a href="https://www.instagram.com/bichosalafuga/" target="_blank">Instagram</a> ·
  <a href="https://www.tiktok.com/@bichosalafuga" target="_blank">TikTok</a> ·
  <a href="https://x.com/bichosalafuga" target="_blank">X</a> ·
  <a href="https://www.youtube.com/@BichosalaFuga" target="_blank">YouTube</a>
</footer>

<script>
/* ================= CONFIG ================= */
const API = "https://bichos-backend.onrender.com";

/* ================= ENVIAR APUESTA ================= */
document.getElementById("enviarApuesta").addEventListener("click", async ()=>{

  const nombre = document.getElementById("nombreJugador").value.trim();
  if(!nombre){
    document.getElementById("resultado").textContent =
      "❌ Debes introducir tu nombre";
    return;
  }

  const apuesta = {
    nombre,
    carrera: parseInt(document.getElementById("carreraId").value),
    ganador: document.getElementById("ganador").value,
    segundo: document.getElementById("segundo").value,
    tercero: document.getElementById("tercero").value,
    primer_movimiento: document.getElementById("primerMovimiento").value,
    primer_salida: document.getElementById("primerSalida").value,
    tiempo: document.getElementById("tiempo").value,
    cuantos_llegan: parseInt(document.getElementById("llegaron").value)
  };

  try{
    const res = await fetch(`${API}/apuesta`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(apuesta)
    });

    const data = await res.json();
    document.getElementById("resultado").textContent =
      JSON.stringify(data,null,2);

  }catch(e){
    document.getElementById("resultado").textContent =
      "❌ Error enviando la apuesta";
  }
});
</script>

</body>
</html>
