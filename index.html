<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bichos a la fuga</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>🐌 Bichos a la fuga</h1>
  <p>El campeonato más lento del mundo</p>
</header>

<main>
  <p>
    Juego privado con fines lúdicos.<br>
    Apuestas con moneda ficticia sin valor económico.
  </p>

  <a class="btn" href="carrera.html">Entrar a la carrera</a>
</main>
  
<script>
fetch("https://bichos-backend.onrender.com/ranking")
  .then(res => res.json())
  .then(data => {
    console.log("Ranking:", data);
  });
</script>
  
<footer>
  <p>
    Juego privado · Moneda ficticia · Sin pagos ni premios reales
  </p>
</footer>
<h2>🏆 Ranking de la temporada</h2>
<ul id="ranking"></ul>

<script>
fetch("https://bichos-backend.onrender.com/ranking")
  .then(response => response.json())
  .then(data => {
    const lista = document.getElementById("ranking");
    lista.innerHTML = "";

    data.forEach((usuario, index) => {
      const li = document.createElement("li");
      li.textContent = `${index + 1}. ${usuario.nombre} — 🥬 ${usuario.lechuguines}`;
      lista.appendChild(li);
    });
  })
  .catch(error => {
    console.error("Error conectando con backend:", error);
  });
</script>

</body>
</html>
