<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bichos a la fuga – Corredores</title>

<style>
body { font-family:sans-serif; margin:0; background:#f8f8f8; }
header { background:#4CAF50; color:white; padding:20px; text-align:center; }
main { margin:20px; display:grid;
       grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
       gap:20px; }
.corredor {
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
  text-align:center;
}
.corredor h3 { margin-top:0; }
.stats { font-size:14px; margin-top:10px; color:#333; }
footer { text-align:center; margin:40px 0; }
footer a { margin:0 10px; color:#4CAF50; text-decoration:none; }
</style>
</head>

<body>

<header>
  <h1>🐌 Corredores oficiales</h1>
  <p>Los bichos más rápidos (o menos lentos)</p>
</header>

<main id="listaCorredores">
  Cargando corredores...
</main>

<footer>
  <a href="https://www.instagram.com/bichosalafuga/" target="_blank">Instagram</a> ·
  <a href="https://www.tiktok.com/@bichosalafuga" target="_blank">TikTok</a> ·
  <a href="https://x.com/bichosalafuga" target="_blank">X</a> ·
  <a href="https://www.youtube.com/@BichosalaFuga" target="_blank">YouTube</a>
</footer>

<script>
/* ================= CONFIG ================= */
const API = "https://bichos-backend.onrender.com";

/* ================= CARGAR CORREDORES ================= */
async function cargarCorredores(){
  const cont = document.getElementById("listaCorredores");

  try{
    const res = await fetch(`${API}/corredores`);
    const corredores = await res.json();

    cont.innerHTML = "";

    corredores.forEach(c => {
      const div = document.createElement("div");
      div.className = "corredor";

      div.innerHTML = `
        <h3>${c.nombre}</h3>
        <p>${c.descripcion || "Caracol profesional"}</p>

        <div class="stats">
          <p>🏆 Victorias: ${c.victorias ?? 0}</p>
          <p>🥈 Podios: ${c.podios ?? 0}</p>
          <p>🏁 Carreras: ${c.carreras ?? 0}</p>
          <p>⚡ Primer movimiento: ${c.primer_movimiento ?? 0}</p>
          <p>💥 Primer en salirse: ${c.primer_salida ?? 0}</p>
        </div>
      `;

      cont.appendChild(div);
    });

  }catch(e){
    cont.textContent = "❌ Error cargando corredores";
  }
}

cargarCorredores();
</script>

</body>
</html>
