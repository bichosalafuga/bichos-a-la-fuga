<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Corredores Babosos</title>
<style>
body { font-family: sans-serif; margin: 20px; background: #f9f9f9; }
h1 { text-align: center; color: #4CAF50; margin-bottom: 30px; }
.corredor { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.nombre { font-weight: bold; font-size: 1.5em; margin-bottom: 5px; }
.descripcion { margin: 5px 0; font-style: italic; color: #555; }
.habilidades, .debilidades { margin: 5px 0; }
.video-container { margin: 10px 0; }
.video-container iframe { width: 100%; height: 315px; border-radius: 8px; }
nav { background:#333; display:flex; justify-content:center; padding:10px; margin-bottom:20px; }
nav a { color:white; text-decoration:none; padding:10px 20px; }
nav a:hover { background-color:#4CAF50; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Inicio</a>
  <a href="apuestas.html">Apuestas</a>
  <a href="corredores.html">Corredores</a>
  <a href="carreras.html">Carreras</a>
</nav>

<h1>🐌 Corredores Babosos</h1>
<div id="corredoresContainer"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const corredores = [
    {
      nombre: "Toreto",
      descripcion: "Rápido y baboso",
      habilidades: ["Arranque veloz", "Resistencia alta"],
      debilidades: ["Poca maniobrabilidad en curvas"],
      videoCorredor: "https://www.youtube.com/embed/dQw4w9WgXcQ"
    },
    {
      nombre: "Sinhuellas",
      descripcion: "No deja rastro",
      habilidades: ["Sigiloso", "Evitación de obstáculos"],
      debilidades: ["Velocidad media"],
      videoCorredor: "https://www.youtube.com/embed/5qap5aO4i9A"
    },
    {
      nombre: "Gari",
      descripcion: "Ojo loco",
      habilidades: ["Saltos impredecibles", "Acelera sorpresivamente"],
      debilidades: ["Inconstante", "Se distrae fácil"],
      videoCorredor: "https://www.youtube.com/embed/3JZ_D3ELwOQ"
    },
    {
      nombre: "Arrastrado",
      descripcion: "Lento pero constante",
      habilidades: ["Constancia", "No se cansa fácilmente"],
      debilidades: ["Muy lento al inicio"],
      videoCorredor: "https://www.youtube.com/embed/V-_O7nl0Ii0"
    },
    {
      nombre: "Baboso Flash",
      descripcion: "Rápido y resbaladizo",
      habilidades: ["Gran velocidad punta", "Agilidad extrema"],
      debilidades: ["Se resbala en curvas húmedas"],
      videoCorredor: "https://www.youtube.com/embed/fLexgOxsZu0"
    }
  ];

  const container = document.getElementById("corredoresContainer");
  container.innerHTML = "";

  corredores.forEach(c => {
    const div = document.createElement("div");
    div.className = "corredor";

    div.innerHTML = `
      <div class="nombre">${c.nombre}</div>
      <div class="descripcion">${c.descripcion}</div>
      <div class="habilidades"><strong>Habilidades:</strong> ${c.habilidades.join(", ")}</div>
      <div class="debilidades"><strong>Debilidades:</strong> ${c.debilidades.join(", ")}</div>
      <div class="video-container">
        <strong>Video del corredor:</strong>
        <iframe src="${c.videoCorredor}" frameborder="0" allowfullscreen></iframe>
      </div>
    `;

    container.appendChild(div);
  });

});
</script>

</body>
</html>
