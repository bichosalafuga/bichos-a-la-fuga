<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Corredores Babosos</title>
<style>
  body { font-family: sans-serif; margin: 20px; background: #f9f9f9; }
  h1 { text-align: center; color: #4CAF50; margin-bottom: 30px; }
  .corredor { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .nombre { font-weight: bold; font-size: 1.5em; margin-bottom: 5px; }
  .descripcion { margin: 5px 0; font-style: italic; color: #555; }
  .habilidades, .debilidades { margin: 5px 0; }
  .video-container { margin: 10px 0; }
  .video-container iframe { width: 100%; height: 315px; border-radius: 8px; }
</style>
</head>
<body>

<!-- MENÚ DE NAVEGACIÓN -->
<nav style="background:#333; display:flex; justify-content:center; padding:10px; margin-bottom:20px;">
  <a href="index.html" style="color:white; text-decoration:none; padding:10px 20px;">Inicio</a>
  <a href="apuestas.html" style="color:white; text-decoration:none; padding:10px 20px;">Apuestas</a>
  <a href="corredores.html" style="color:white; text-decoration:none; padding:10px 20px;">Corredores</a>
  <a href="carreras.html" style="color:white; text-decoration:none; padding:10px 20px;">Carreras</a>
</nav>

<h1>🐌 Corredores Babosos</h1>

<div id="corredoresContainer"></div>

<script>
// Lista de corredores con habilidades, debilidades y videos
const corredores = [
  {
    nombre: "Toreto",
    descripcion: "Rápido y baboso",
    habilidades: ["Arranque veloz", "Resistencia alta"],
    debilidades: ["Poca maniobrabilidad en curvas"],
    videoCorredor: "https://www.youtube.com/embed/dQw4w9WgXcQ",
    videoEntrenador: "https://www.youtube.com/embed/9bZkp7q19f0"
  },
  {
    nombre: "Sinhuellas",
    descripcion: "No deja rastro",
    habilidades: ["Sigiloso", "Evitación de obstáculos"],
    debilidades: ["Velocidad media"],
    videoCorredor: "https://www.youtube.com/embed/5qap5aO4i9A",
    videoEntrenador: "https://www.youtube.com/embed/L_jWHffIx5E"
  },
  {
    nombre: "Tro Gari",
    descripcion: "Ojo loco",
    habilidades: ["Saltos impredecibles", "Acelera sorpresivamente"],
    debilidades: ["Inconstante", "Se distrae fácil"],
    videoCorredor: "https://www.youtube.com/embed/3JZ_D3ELwOQ",
    videoEntrenador: "https://www.youtube.com/embed/tgbNymZ7vqY"
  },
  {
    nombre: "Arrastrado",
    descripcion: "Lento pero constante",
    habilidades: ["Constancia", "No se cansa fácilmente"],
    debilidades: ["Muy lento al inicio"],
    videoCorredor: "https://www.youtube.com/embed/V-_O7nl0Ii0",
    videoEntrenador: "https://www.youtube.com/embed/e-ORhEE9VVg"
  },
  {
    nombre: "Baboso Flash",
    descripcion: "Rápido y resbaladizo",
    habilidades: ["Gran velocidad punta", "Agilidad extrema"],
    debilidades: ["Se resbala en curvas húmedas"],
    videoCorredor: "https://www.youtube.com/embed/fLexgOxsZu0",
    videoEntrenador: "https://www.youtube.com/embed/uelHwf8o7_U"
  }
];

// Mostrar corredores en el contenedor
function mostrarCorredores() {
  const container = document.getElementById("corredoresContainer");
  container.innerHTML = "";

  corredores.forEach(c => {
    const div = document.createElement("div");
    div.className = "corredor";

    const nombre = document.createElement("div");
    nombre.className = "nombre";
    nombre.textContent = c.nombre;

    const descripcion = document.createElement("div");
    descripcion.className = "descripcion";
    descripcion.textContent = c.descripcion;

    const habilidades = document.createElement("div");
    habilidades.className = "habilidades";
    habilidades.textContent = `Habilidades: ${c.habilidades.join(", ")}`;

    const debilidades = document.createElement("div");
    debilidades.className = "debilidades";
    debilidades.textContent = `Debilidades: ${c.debilidades.join(", ")}`;

    const videoC = document.createElement("div");
    videoC.className = "video-container";
    videoC.innerHTML = `<strong>Video del corredor:</strong><iframe src="${c.videoCorredor}" frameborder="0" allowfullscreen></iframe>`;

    const videoE = document.createElement("div");
    videoE.className = "video-container";
    videoE.innerHTML = `<strong>Video del entrenador:</strong><iframe src="${c.videoEntrenador}" frameborder="0" allowfullscreen></iframe>`;

    div.appendChild(nombre);
    div.appendChild(descripcion);
    div.appendChild(habilidades);
    div.appendChild(debilidades);
    div.appendChild(videoC);
    div.appendChild(videoE);

    container.appendChild(div);
  });
}

// Mostrar al cargar
mostrarCorredores();
</script>

</body>
</html>
