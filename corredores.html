<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Corredores Babosos</title>
<style>
  body { font-family: sans-serif; margin: 20px; background: #f9f9f9; }
  h1 { text-align: center; color: #4CAF50; }
  .corredor { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .nombre { font-weight: bold; font-size: 1.2em; }
  .descripcion { margin: 5px 0; }
  .estadistica { font-size: 0.9em; color: #555; }
  button { padding: 5px 10px; margin-top: 10px; cursor: pointer; }
</style>
</head>
<!-- MENÚ DE NAVEGACIÓN COMÚN -->
<nav style="background:#333; display:flex; justify-content:center; padding:10px;">
  <a href="index.html" style="color:white; text-decoration:none; padding:10px 20px;">Inicio</a>
  <a href="apuestas.html" style="color:white; text-decoration:none; padding:10px 20px;">Apuestas</a>
  <a href="carreras.html" style="color:white; text-decoration:none; padding:10px 20px;">Carreras</a>
  <a href="corredores.html" style="color:white; text-decoration:none; padding:10px 20px;">Corredores</a>
</nav>

  <body>

<h1>🐌 Corredores Babosos</h1>

<div id="corredoresContainer"></div>

<script>
// Lista de corredores
const corredores = [
  { nombre: "Toreto", descripcion: "Rápido y baboso" },
  { nombre: "Sinhuellas", descripcion: "No deja rastro" },
  { nombre: "Tro Gari", descripcion: "Ojo loco" },
  { nombre: "Arrastrado", descripcion: "Lento pero constante" },
  { nombre: "Baboso Flash", descripcion: "Rápido y resbaladizo" }
];

// Función para crear la tarjeta de cada corredor
function mostrarCorredores() {
  const container = document.getElementById("corredoresContainer");
  container.innerHTML = "";

  corredores.forEach(c => {
    const div = document.createElement("div");
    div.className = "corredor";

    const nombre = document.createElement("div");
    nombre.className = "nombre";
    nombre.textContent = c.nombre;

    const descripcion = document.createElement("div");
    descripcion.className = "descripcion";
    descripcion.textContent = c.descripcion;

    const estadistica = document.createElement("div");
    estadistica.className = "estadistica";
    estadistica.textContent = `Velocidad simulada: ${Math.floor(Math.random()*10)+1} babosas/seg`;

    const boton = document.createElement("button");
    boton.textContent = "Simular posición";
    boton.onclick = () => {
      const posicion = Math.floor(Math.random() * corredores.length) + 1;
      alert(`${c.nombre} terminó en la posición ${posicion}`);
    }

    div.appendChild(nombre);
    div.appendChild(descripcion);
    div.appendChild(estadistica);
    div.appendChild(boton);
    container.appendChild(div);
  });
}

// Mostrar al cargar
mostrarCorredores();
</script>

</body>
</html>
