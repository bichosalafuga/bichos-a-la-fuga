<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bichos a la fuga – Corredores</title>

<style>
body { font-family:sans-serif; margin:0; background:#f8f8f8; }
header { background:#4CAF50; color:white; padding:20px; text-align:center; }
main {
  margin:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.corredor {
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
  text-align:center;
}
.corredor h3 { margin-top:0; }
.stats { font-size:14px; margin-top:10px; color:#333; }
footer { text-align:center; margin:40px 0; }
footer a { margin:0 10px; color:#4CAF50; text-decoration:none; }
</style>
</head>

<body>

<header>
  <h1>🐌 Corredores oficiales</h1>
  <p>Los protagonistas del barro</p>
</header>

<main id="listaCorredores"></main>

<footer>
  <a href="index.html">Inicio</a> ·
  <a href="carreras.html">Carreras</a> ·
  <a href="apuestas.html">Apostar</a>
</footer>

<script>
/* ================= CORREDORES FIJOS ================= */
const corredores = [
  {
    nombre: "Toreto",
    descripcion: "Sale lento, pero cuando arranca no hay quien lo pare."
  },
  {
    nombre: "Sinhuellas",
    descripcion: "Sigiloso, impredecible y amante del carril interior."
  },
  {
    nombre: "Gari",
    descripcion: "Constante, trabajador y siempre acaba llegando."
  },
  {
    nombre: "Arrastrado",
    descripcion: "Especialista en remontadas imposibles."
  },
  {
    nombre: "Baboso Flash",
    descripcion: "Rápido… para ser un caracol."
  }
];

/* ================= PINTAR ================= */
const cont = document.getElementById("listaCorredores");

corredores.forEach(c => {
  const div = document.createElement("div");
  div.className = "corredor";

  div.innerHTML = `
    <h3>${c.nombre}</h3>
    <p>${c.descripcion}</p>
    <div class="stats">
      <p>🏁 Participante oficial</p>
      <p>🐌 Nivel: impredecible</p>
    </div>
  `;

  cont.appendChild(div);
});
</script>

</body>
</html>
