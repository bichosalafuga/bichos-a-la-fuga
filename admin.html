<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bichos a la fuga - Admin</title>
<style>
body { font-family:sans-serif; margin:20px; }
fieldset { margin-bottom:20px; padding:10px; }
pre { background:#f0f0f0; padding:10px; white-space:pre-wrap; }
input[type="number"] { width:60px; }
</style>
</head>
<body>

<header>
<h1>🐌 Administrador de Bichos a la fuga</h1>
</header>

<main>
<fieldset id="loginAdminFieldset">
<legend>Login Admin</legend>
<label>Usuario: <input type="text" id="adminUser"></label>
<label>Contraseña: <input type="password" id="adminPass"></label>
<button id="loginAdminBtn">Entrar</button>
<pre id="loginResult"></pre>
</fieldset>

<fieldset id="panelAdmin" style="display:none;">
<legend>Panel Admin</legend>
<label>Carrera:
<select id="adminCarreraId">
<option value="1">Escalada Pegada</option>
<option value="2">Desliz Extremo</option>
<option value="3">Reto Baboso</option>
<option value="4">Turbo Caracol</option>
<option value="5">Lenta Conquista</option>
<option value="6">Súper Resbalón</option>
<option value="7">Meta Babosa</option>
<option value="8">Final Legendaria</option>
</select>
</label>

<div id="adminCaracolesContainer"></div>

<label>Tiempo de llegada predominante:
<select id="adminTiempo">
<option value="0-10">0-10</option>
<option value="10-20">10-20</option>
<option value="20-30">20-30</option>
</select>
</label>

<label>Cuántos llegaron:
<select id="adminLlegaron">
<option value="1">1</option><option value="2">2</option>
<option value="3">3</option><option value="4">4</option>
<option value="5">5</option>
</select>
</label>

<button id="finalizarCarrera">Finalizar Carrera</button>
<pre id="adminResult"></pre>
</fieldset>

<script>
// ------------------- CONFIG -------------------
const participantes = ["Toreto","Sinhuellas","Tro Gari","Arrastrado","Baboso Flash"];
let apuestas = [];
let lechuguines = 0;

// LOGIN ADMIN
const loginBtn=document.getElementById("loginAdminBtn");
const loginResult=document.getElementById("loginResult");
const panelAdmin=document.getElementById("panelAdmin");

loginBtn.addEventListener("click",()=>{
const usuario=document.getElementById("adminUser").value;
const pass=document.getElementById("adminPass").value;
if(usuario==="admin"&&pass==="1234"){
  loginResult.textContent="Acceso concedido ✅";
  panelAdmin.style.display="block";
  document.getElementById("loginAdminFieldset").style.display="none";
  generarPanelAdmin();
}else loginResult.textContent="Usuario o contraseña incorrectos ❌";
});

// PANEL ADMIN
function generarPanelAdmin(){
const container=document.getElementById("adminCaracolesContainer");
container.innerHTML="";
participantes.forEach((p,i)=>{
  const field=document.createElement("div");
  field.innerHTML=`
  <strong>${p}</strong><br>
  Posición (1-5): <input type="number" min="1" max="5" value="${i+1}" id="pos_${i}"><br>
  Primer en moverse: <input type="radio" name="primerMover" value="${p}"><br>
  Primer en salirse: <input type="radio" name="primerSalir" value="${p}">
  <hr>
  `;
  container.appendChild(field);
});
}

// FINALIZAR CARRERA
document.getElementById("finalizarCarrera").addEventListener("click",()=>{
  const posiciones=[]; 
  const primerMover=document.querySelector('input[name="primerMover"]:checked')?.value;
  const primerSalir=document.querySelector('input[name="primerSalir"]:checked')?.value;
  const tiempo=document.getElementById("adminTiempo").value;
  const cuantosLlegan=parseInt(document.getElementById("adminLlegaron").value);

  participantes.forEach((p,i)=>{
    const posVal=parseInt(document.getElementById(`pos_${i}`).value);
    posiciones[posVal-1]=p;
  });

  let resultadosTexto=`Posiciones: ${posiciones.join(", ")}\nPrimer en moverse: ${primerMover}\nPrimer en salirse: ${primerSalir}\nTiempo: ${tiempo}\nCuántos llegaron: ${cuantosLlegan}\n\n`;

  apuestas.forEach(a=>{
    let ganancia=a.cantidad;
    if(a.tipo==="posicion"){ if(a.objetivo.posicion<=3 && posiciones[a.objetivo.posicion-1]===a.objetivo.nombre) ganancia*=2; else ganancia=0; }
    else if(a.tipo==="primer_movimiento"){ if(a.objetivo===primerMover) ganancia*=3; else ganancia=0; }
    else if(a.tipo==="primer_salida"){ if(a.objetivo===primerSalir) ganancia*=3; else ganancia=0; }
    else if(a.tipo==="tiempo"){ if(a.objetivo===tiempo) ganancia*=3; else ganancia=0; }
    else if(a.tipo==="cuantos_llegan"){ if(a.objetivo===cuantosLlegan) ganancia*=3; else ganancia=0; }
    lechuguines+=ganancia;
    resultadosTexto+=`Usuario ${a.usuario} ganó ${ganancia} lechuguines\n`;
  });

  document.getElementById("adminResult").innerText=resultadosTexto;
  apuestas=[];
});
</script>
</body>
</html>
