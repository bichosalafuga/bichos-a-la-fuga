<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bichos a la fuga - Carreras</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 0; background: #f8f8f8; }
header { background: #4CAF50; color: white; padding: 20px; text-align: center; }
nav { background: #333; display: flex; justify-content: center; }
nav a { color: white; text-decoration: none; padding: 10px 20px; }
nav a:hover { background-color: #4CAF50; color: white; border-radius: 5px; }
main { margin: 20px; }
label { display:block; margin-bottom:10px; }
select { padding:5px; font-size:16px; }
.video-container { margin: 20px 0; }
.video-container iframe { width: 100%; height: 315px; border-radius: 8px; }
.live-link { display: inline-block; margin-bottom: 10px; padding: 10px 15px; background: #FF0000; color: white; font-weight: bold; text-decoration: none; border-radius: 5px; }
.live-link:hover { background: #cc0000; }
.social-links { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
.social-btn { display: flex; align-items: center; gap: 5px; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; color: white; transition: transform 0.2s, box-shadow 0.2s; }
.social-btn.instagram { background: #E1306C; }
.social-btn.tiktok { background: #010101; }
.social-btn.youtube { background: #FF0000; }
.social-btn:hover { transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<header>
  <h1>🏁 Carreras - Bichos a la fuga</h1>
  <p>Consulta el video de cada carrera y los mejores momentos</p>
</header>

<nav>
  <a href="index.html">Inicio</a>
  <a href="corredores.html">Corredores</a>
  <a href="carreras.html">Carreras</a>
  <a href="apuestas.html">Apuestas</a>
</nav>

<main>
<h2>Selecciona la carrera</h2>
<label>

    <option value="1">Escalada Pegada</option>
    <option value="2">Desliz Extremo</option>
    <option value="3">Reto Baboso</option>
    <option value="4">Turbo Caracol</option>
    <option value="5">Lenta Conquista</option>
    <option value="6">Súper Resbalón</option>
    <option value="7">Meta Babosa</option>

<h2>Redes sociales</h2>
<div class="social-links">

    📸 Instagram
  </a>
  <a href="https://www.tiktok.com/@bichosalafuga" target="_blank" class="social-btn tiktok">

  </a>
  <a href="https://www.youtube.com/@BichosalaFuga" target="_blank" class="social-btn youtube">

<script>

</main>
</body>
</html>
