<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bichos a la fuga - Carreras</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 0; background: #f8f8f8; }
header { background: #4CAF50; color: white; padding: 20px; text-align: center; }
nav { background: #333; display: flex; justify-content: center; }
nav a { color: white; text-decoration: none; padding: 10px 20px; }
nav a:hover { background-color: #4CAF50; color: white; border-radius: 5px; }
main { margin: 20px; }
fieldset { margin-bottom: 20px; padding: 10px; background:#fff; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
pre { background:#f0f0f0; padding:10px; white-space:pre-wrap; border-radius:5px; }
label { display:block; margin-bottom:10px; }
select { padding:5px; font-size:16px; }
.video-container { margin: 20px 0; }
.video-container iframe { width: 100%; height: 315px; }
.socials { display:flex; gap:15px; justify-content:center; margin-top:20px; }
.socials a { text-decoration:none; color:#333; font-weight:bold; padding:8px 12px; background:#eee; border-radius:5px; }
.socials a:hover { background:#4CAF50; color:white; }
</style>
</head>
<body>

<header>
  <h1>🏁 Carreras - Bichos a la fuga</h1>
  <p>Mira las carreras o consulta videos explicativos</p>
</header>

<nav>
  <a href="index.html">Inicio</a>
  <a href="apuestas.html">Apuestas</a>
  <a href="corredores.html">Corredores</a>
  <a href="carreras.html">Carreras</a>
</nav>

<main>

<h2>Selecciona la carrera</h2>
<label>
  Carrera:
  <select id="selectCarrera">
    <option value="1">Escalada Pegada</option>
    <option value="2">Desliz Extremo</option>
    <option value="3">Reto Baboso</option>
    <option value="4">Turbo Caracol</option>
    <option value="5">Lenta Conquista</option>
    <option value="6">Súper Resbalón</option>
    <option value="7">Meta Babosa</option>
    <option value="8">Final Legendaria</option>
  </select>
</label>

<h2>Video explicativo de la carrera</h2>
<div class="video-container">
  <iframe id="videoExplicativo" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video explicativo de la carrera" frameborder="0" allowfullscreen></iframe>
</div>

<fieldset>
  <legend>Resultados y datos para apostar</legend>
  <pre id="resultadosCarrera">Selecciona una carrera para ver los resultados o estado.</pre>
</fieldset>

<div class="socials">
  <a href="https://www.instagram.com/tu_canal" target="_blank">Instagram</a>
  <a href="https://www.tiktok.com/@tu_canal" target="_blank">TikTok</a>
  <a href="https://www.youtube.com/@tu_canal" target="_blank">YouTube</a>
</div>

<script>
// Datos de apuestas disponibles
const resultadosDefinitivos = {
  1: { 
      posicion:["Toreto","Sinhuellas","Gari","Arrastrado","Baboso Flash"],
      primer_movimiento:"Sinhuellas",
      primer_salida:"Toreto",
      tiempo:"10-20",
      cuantos_llegan:5
  },
  2: { 
      posicion:["Sinhuellas","Toreto","Gari","Arrastrado","Baboso Flash"],
      primer_movimiento:"Toreto",
      primer_salida:"Gari",
      tiempo:"5-15",
      cuantos_llegan:4
  },
  3: { 
      posicion:["Gari","Sinhuellas","Toreto","Arrastrado","Baboso Flash"],
      primer_movimiento:"Gari",
      primer_salida:"Arrastrado",
      tiempo:"7-17",
      cuantos_llegan:5
  }
  // Carreras 4 a 8 aún no se han corrido
};

// Videos explicativos por carrera
const videosExplicativos = {
  1: "https://www.youtube.com/embed/dQw4w9WgXcQ",
  2: "https://www.youtube.com/embed/9bZkp7q19f0",
  3: "https://www.youtube.com/embed/dQw4w9WgXcQ",
  4: "https://www.youtube.com/embed/9bZkp7q19f0",
  5: "https://www.youtube.com/embed/dQw4w9WgXcQ",
  6: "https://www.youtube.com/embed/9bZkp7q19f0",
  7: "https://www.youtube.com/embed/dQw4w9WgXcQ",
  8: "https://www.youtube.com/embed/9bZkp7q19f0"
};

// Mostrar resultados y datos de apuesta
function mostrarResultados() {
  const carreraId = document.getElementById("selectCarrera").value;
  document.getElementById("videoExplicativo").src = videosExplicativos[carreraId];

  const resultados = resultadosDefinitivos[carreraId];
  const pre = document.getElementById("resultadosCarrera");

  if(resultados){
    pre.innerText = `
Datos disponibles para apostar:

- Posiciones finales: ${resultados.posicion.join(", ")}
- Primer en moverse: ${resultados.primer_movimiento}
- Primer en salirse: ${resultados.primer_salida}
- Tiempo de llegada: ${resultados.tiempo}
- Cuántos llegan: ${resultados.cuantos_llegan}
    `;
  } else {
    pre.innerText = "⚠️ Carrera aún no realizada. Los datos de apuestas estarán disponibles después de la carrera.";
  }
}

document.getElementById("selectCarrera").addEventListener("change", mostrarResultados);

// Inicializa con la primera carrera
mostrarResultados();
</script>

</main>
</body>
</html>
