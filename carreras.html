<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bichos a la fuga - Carreras</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 0; background: #f8f8f8; }
header { background: #4CAF50; color: white; padding: 20px; text-align: center; }
nav { background: #333; display: flex; justify-content: center; }
nav a { color: white; text-decoration: none; padding: 10px 20px; }
nav a:hover { background-color: #4CAF50; color: white; border-radius: 5px; }
main { margin: 20px; }
label { display:block; margin-bottom:10px; }
select { padding:5px; font-size:16px; }
.video-container { margin: 20px 0; }
.video-container iframe { width: 100%; height: 315px; }
.social-links { margin-top: 15px; }
.social-links a { margin-right: 10px; text-decoration:none; color:#4CAF50; font-weight:bold; }
</style>
</head>
<body>

<header>
  <h1>🏁 Carreras - Bichos a la fuga</h1>
  <p>Consulta el video de cada carrera</p>
</header>

<nav>
  <a href="index.html">Inicio</a>
  <a href="apuestas.html">Apuestas</a>
  <a href="corredores.html">Corredores</a>
  <a href="carreras.html">Carreras</a>
</nav>

<main>
<h2>Selecciona la carrera</h2>
<label>
  Carrera:
  <select id="selectCarrera">
    <option value="1">Escalada Pegada</option>
    <option value="2">Desliz Extremo</option>
    <option value="3">Reto Baboso</option>
    <option value="4">Turbo Caracol</option>
    <option value="5">Lenta Conquista</option>
    <option value="6">Súper Resbalón</option>
    <option value="7">Meta Babosa</option>
    <option value="8">Final Legendaria</option>
  </select>
</label>

<h2>Video explicativo</h2>
<div class="video-container">
  <iframe id="videoExplicativo" src="" title="Video explicativo" frameborder="0" allowfullscreen></iframe>
</div>

<h2>Redes sociales</h2>
<div class="social-links">
  <a href="https://www.instagram.com/bichosalafuga/" target="_blank">Instagram</a>
  <a href="https://www.tiktok.com/@bichosalafuga" target="_blank">TikTok</a>
  <a href="https://www.youtube.com/@BichosalaFuga" target="_blank">YouTube</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const videosExplicativos = {
    1: "https://www.youtube.com/embed/dQw4w9WgXcQ",
    2: "https://www.youtube.com/embed/9bZkp7q19f0",
    3: "https://www.youtube.com/embed/dQw4w9WgXcQ",
    4: "https://www.youtube.com/embed/9bZkp7q19f0",
    5: "https://www.youtube.com/embed/dQw4w9WgXcQ",
    6: "https://www.youtube.com/embed/9bZkp7q19f0",
    7: "https://www.youtube.com/embed/dQw4w9WgXcQ",
    8: "https://www.youtube.com/embed/9bZkp7q19f0"
  };

  function actualizarCarrera() {
    const carreraId = parseInt(document.getElementById("selectCarrera").value);
    document.getElementById("videoExplicativo").src = videosExplicativos[carreraId];
  }

  document.getElementById("selectCarrera").addEventListener("change", actualizarCarrera);

  // Inicializar
  actualizarCarrera();

});
</script>

</main>
</body>
</html>
