<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bichos a la fuga – Carreras</title>

<style>
body { font-family:sans-serif; margin:0; background:#f8f8f8; }
header { background:#4CAF50; color:white; padding:20px; text-align:center; }
nav { background:#333; display:flex; justify-content:center; }
nav a { color:white; text-decoration:none; padding:10px 20px; }
nav a:hover { background:#4CAF50; border-radius:5px; }
main { margin:20px; }
fieldset {
  background:#fff;
  padding:15px;
  margin-bottom:20px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
}
.video-container iframe { width:100%; height:315px; border-radius:8px; }
ul { padding-left:20px; }
</style>
</head>

<body>

<header>
  <h1>🏁 Carreras oficiales</h1>
  <p>Información previa a la apuesta</p>
</header>

<nav>
  <a href="index.html">Inicio</a>
  <a href="apuestas.html">Apuestas</a>
  <a href="corredores.html">Corredores</a>
  <a href="carreras.html">Carreras</a>
</nav>

<main>

<label>
  Carrera:
  <select id="selectCarrera"></select>
</label>

<fieldset>
  <legend>📺 Vídeo explicativo</legend>
  <div class="video-container">
    <iframe id="videoCarrera" src="" allowfullscreen></iframe>
  </div>
</fieldset>

<fieldset>
  <legend>🐌 Participantes</legend>
  <ul id="listaParticipantes"></ul>
</fieldset>

<fieldset>
  <legend>🎯 Opciones de apuesta</legend>
  <ul>
    <li>Posición final</li>
    <li>Primer en moverse</li>
    <li>Primer en salirse</li>
    <li>Tiempo de llegada</li>
    <li>Cuántos llegan a meta</li>
  </ul>
</fieldset>

</main>

<script>
/* ================= DATOS FIJOS ================= */

const carreras = [
  {
    id:1,
    nombre:"Escalada Pegada",
    video:"https://www.youtube.com/embed/dQw4w9WgXcQ",
    participantes:["Toreto","Sinhuellas","Gari","Arrastrado","Baboso Flash"]
  },
  {
    id:2,
    nombre:"Desliz Extremo",
    video:"https://www.youtube.com/embed/9bZkp7q19f0",
    participantes:["Sinhuellas","Toreto","Gari","Arrastrado","Baboso Flash"]
  },
  {
    id:3,
    nombre:"Reto Baboso",
    video:"https://www.youtube.com/embed/dQw4w9WgXcQ",
    participantes:["Gari","Sinhuellas","Toreto","Arrastrado","Baboso Flash"]
  },
  {
    id:4,
    nombre:"Turbo Caracol",
    video:"https://www.youtube.com/embed/9bZkp7q19f0",
    participantes:["Toreto","Gari","Sinhuellas","Arrastrado","Baboso Flash"]
  }
];

/* ================= INIT ================= */

const select = document.getElementById("selectCarrera");
const video = document.getElementById("videoCarrera");
const lista = document.getElementById("listaParticipantes");

carreras.forEach(c=>{
  const opt = document.createElement("option");
  opt.value = c.id;
  opt.textContent = `Carrera ${c.id} – ${c.nombre}`;
  select.appendChild(opt);
});

function actualizar(){
  const carrera = carreras.find(c=>c.id==select.value);
  video.src = carrera.video;
  lista.innerHTML = "";
  carrera.participantes.forEach(p=>{
    const li=document.createElement("li");
    li.textContent=p;
    lista.appendChild(li);
  });
}

select.addEventListener("change", actualizar);
actualizar();
</script>

</body>
</html>
