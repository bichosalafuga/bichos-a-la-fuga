<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bichos a la fuga – Carreras</title>

<style>
body { font-family:sans-serif; margin:0; background:#f8f8f8; }
header { background:#4CAF50; color:white; padding:20px; text-align:center; }
main { margin:20px; }
.carrera {
  background:#fff;
  margin-bottom:20px;
  padding:15px;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
}
.cerrada { opacity:.6; }
.finalizada { border-left:6px solid #4CAF50; }
.abierta { border-left:6px solid orange; }
h3 { margin-top:0; }
ul { padding-left:20px; }
footer { text-align:center; margin:40px 0; }
footer a { margin:0 10px; color:#4CAF50; text-decoration:none; }
</style>
</head>

<body>

<header>
  <h1>🏁 Carreras – Bichos a la fuga</h1>
  <p>Estado y resultados oficiales</p>
</header>

<main id="contenedorCarreras">
  Cargando carreras...
</main>

<footer>
  <a href="https://www.instagram.com/bichosalafuga/" target="_blank">Instagram</a> ·
  <a href="https://www.tiktok.com/@bichosalafuga" target="_blank">TikTok</a> ·
  <a href="https://x.com/bichosalafuga" target="_blank">X</a> ·
  <a href="https://www.youtube.com/@BichosalaFuga" target="_blank">YouTube</a>
</footer>

<script>
/* ================= CONFIG ================= */
const API = "https://bichos-backend.onrender.com";

/* ================= CARGAR CARRERAS ================= */
async function cargarCarreras(){
  const cont = document.getElementById("contenedorCarreras");
  cont.textContent = "Cargando carreras...";

  try{
    const res = await fetch(`${API}/carreras`);
    const carreras = await res.json();

    cont.innerHTML = "";

    carreras.forEach(c => {
      const div = document.createElement("div");
      div.className = `carrera ${c.estado}`;

      let html = `
        <h3>Carrera ${c.id} – ${c.nombre}</h3>
        <p><strong>Estado:</strong> ${c.estado}</p>
      `;

      if(c.estado === "finalizada" && c.resultado){
        html += `
          <h4>🏆 Resultado oficial</h4>
          <ul>
            <li>🥇 ${c.resultado.posicion[0]}</li>
            <li>🥈 ${c.resultado.posicion[1]}</li>
            <li>🥉 ${c.resultado.posicion[2]}</li>
          </ul>
          <p><strong>Primer movimiento:</strong> ${c.resultado.primer_movimiento}</p>
          <p><strong>Primer en salirse:</strong> ${c.resultado.primer_salida}</p>
          <p><strong>Tiempo:</strong> ${c.resultado.tiempo}</p>
          <p><strong>Llegaron:</strong> ${c.resultado.cuantos_llegan}</p>
        `;
      }

      if(c.estado === "abierta"){
        html += `<p>🟢 Apuestas abiertas</p>`;
      }

      if(c.estado === "cerrada"){
        html += `<p>🔒 Apuestas cerradas</p>`;
      }

      div.innerHTML = html;
      cont.appendChild(div);
    });

  }catch(e){
    cont.textContent = "❌ Error cargando las carreras";
  }
}

cargarCarreras();
</script>

</body>
</html>
